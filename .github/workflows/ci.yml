name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  # Dev toolchain job: Vitest (Vite) requires Node >= 20.19, so the dev suite
  # runs on 22. This job does not prove the runtime minimum.
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: "Lint (bounded AST policy: syntax, debugger, duplicate keys, UTF-8; vendor excluded)"
        run: node scripts/lint.mjs

      - name: Typecheck source
        run: node scripts/verify.mjs typecheck

      - name: Typecheck tests (strict)
        run: node scripts/verify.mjs typecheck-tests

      - run: npm run build

      - name: Version badge matches package.json
        run: node scripts/verify.mjs metadata

      # README-примеры исполняются тестами: им нужен каталог agent-skills.
      # Без него контракты S-04/S-05 пропускаются, а не падают на чужом пути.
      - name: Checkout agent-skills (README command contracts)
        run: |
          git clone --depth 1 https://github.com/BloodyEagle/agent-skills.git "$RUNNER_TEMP/agent-skills"
          echo "AGENT_SKILLS_ROOT=$RUNNER_TEMP/agent-skills" >> "$GITHUB_ENV"

      # Model cache: the multilingual model is ~120 MB, do not download it per run
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small

      - name: Targeted tests (fast, no full suite, offline-guarded and bounded)
        run: |
          node scripts/verify.mjs test \
            src/__tests__/id-generation.test.ts \
            src/__tests__/migration.test.ts \
            src/__tests__/search.hybrid.test.ts \
            src/__tests__/context-budget.test.ts \
            --reporter=dot

      # 08-N2 (план 09): фикстуры только для чтения — eval работает на копии
      # demo.db; открытие фикстуры на месте оставляет сайдкар (-shm) в
      # fixtures/ и страж repo-hygiene валит прогон.
      - name: Eval (recall@10)
        run: |
          cp fixtures/demo.db "$RUNNER_TEMP/eval-demo.db"
          MEGAMEMORY_DB_PATH="$RUNNER_TEMP/eval-demo.db" node dist/index.js eval --min 0.8

      # 2.1.13 F6: полный прогон без флагов - unit/db/integration; HTTP-
      # интеграции проверяют собранный dist, поэтому шаг после npm run build.
      - name: Full test suite (unit/db/integration)
        run: npm test

  # Platform gate on Windows. The matrix separates the product runtime engine
  # (engines.node = >=20.10: build + packaged smoke, no Vitest) from the dev
  # toolchain (>= 20.19: strict test typecheck + pure unit project).
  platform-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - node: "20.10.0"
            suite: runtime
          - node: "22"
            suite: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: node scripts/lint.mjs

      - name: Typecheck source
        run: node scripts/verify.mjs typecheck

      - run: npm run build

      - name: Version badge matches package.json
        run: node scripts/verify.mjs metadata

      # Runtime minimum proof: pack the built tree, validate composition
      # exactly (npm pack JSON, no ls/head) and smoke the extracted package
      # with redirected local dependencies (no install, no junction).
      - name: Packaged runtime smoke (Node 20.10 = engines minimum)
        if: matrix.suite == 'runtime'
        run: node scripts/package.mjs "$env:RUNNER_TEMP\mm-pack"

      - name: Dev toolchain checks (Node >= 20.19 for Vitest)
        if: matrix.suite == 'dev'
        run: |
          node scripts/verify.mjs typecheck-tests
          node scripts/verify.mjs test --project unit
