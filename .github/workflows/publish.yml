name: Publish to npm

on:
  release:
    types: [published]

jobs:
  # Gate job: full test suite on the built tree, then npm pack with exact JSON
  # capture. The tarball and its sha256 are stored as artifacts; publishing
  # never repacks the checkout directory.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Model cache: the multilingual model is ~120 MB, do not download it per run
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small

      # R-08 (план 08): release gate. Provenance-аттестация не заменяет тесты:
      # сначала полный прогон (unit/db/integration — integration поднимает
      # собранный dist), потом проверка версии и функциональность tarball, и
      # только затем публикация.
      - run: npm run build
      - run: npm test

      - name: Package version matches the release tag
        run: node scripts/verify.mjs metadata "${{ github.event.release.tag_name }}"

      - name: Pack and verify the tested tree (exact capture + composition + smoke)
        run: node scripts/package.mjs "$GITHUB_WORKSPACE/staging"

      - uses: actions/upload-artifact@v4
        with:
          name: megamemory-tarball
          path: staging/
          if-no-files-found: error

  # Publishes exactly the tested tarball byte-for-byte (sha256 verified against
  # pack-result.json from the gate job), after a real install smoke.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # --provenance читает git-remote и commit: без checkout джоб падал
      # «Could not read from remote repository» ещё до загрузки в реестр.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: megamemory-tarball
          path: staging

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve the tested tarball
        # $GITHUB_ENV, а не outputs: у шага не было id, и steps.resolve.outputs
        # приходил пустым — sha-сверка читала каталог staging целиком.
        run: echo "TARBALL=$(node -p "require('./staging/pack-result.json').filename")" >> "$GITHUB_ENV"

      - name: Verify sha256 of the tested tarball
        run: |
          FILENAME="$TARBALL"
          node -e "
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const expected = require('./staging/pack-result.json').sha256;
            const actual = crypto.createHash('sha256').update(fs.readFileSync('staging/' + process.argv[1])).digest('hex');
            if (actual !== expected) { console.error('sha256 mismatch: ' + actual + ' != ' + expected); process.exit(1); }
            console.log('sha256 verified: ' + actual);
          " "$FILENAME"

      - name: Tarball installs and starts
        run: |
          FILENAME="$TARBALL"
          mkdir -p /tmp/mm-smoke
          cd /tmp/mm-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/staging/$FILENAME" >/dev/null
          ./node_modules/.bin/megamemory --version
          ./node_modules/.bin/megamemory --help >/dev/null
          # План 11 (2.2.1): фикстуры только для чтения — stats работает на
          # копии; прямое --db в fixtures/ установленный пакет мутировал бы
          # (авто-миграция + отложенный чекпоинт на выходе процесса).
          cp ./node_modules/@bloodyeagle/megamemory/fixtures/demo.db /tmp/mm-smoke/demo-copy.db
          ./node_modules/.bin/megamemory stats --db /tmp/mm-smoke/demo-copy.db >/dev/null

      - name: Publish the tested tarball
        # Абсолютный путь: относительный «staging/x.tgz» npm парсит как
        # github-shorthand owner/repo и лезет в ssh вместо чтения файла.
        # verbose нужен, чтобы видеть HTTP-ответ реестра: «+ пакет@версия» при
        # exit 0 не доказывает, что версия легла в реестр.
        run: |
          npm whoami || true
          npm publish "$GITHUB_WORKSPACE/staging/$TARBALL" --provenance --access public --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach tarball to the release
        run: gh release upload "${{ github.event.release.tag_name }}" "staging/$TARBALL" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
