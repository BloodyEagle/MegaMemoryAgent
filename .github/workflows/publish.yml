name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Model cache: the multilingual model is ~120 MB, do not download it per run
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small

      # R-08 (план 08): release gate. Provenance-аттестация не заменяет тесты:
      # сначала полный прогон (unit/db/integration — integration поднимает
      # собранный dist), потом проверка версии и функциональность tarball, и
      # только затем публикация.
      - run: npm run build
      - run: npm test

      - name: Package version matches the release tag
        run: |
          PKG=$(node -p 'require("./package.json").version')
          TAG="${{ github.event.release.tag_name }}"
          TAG=${TAG#v}
          test "$PKG" = "$TAG" || { echo "package.json $PKG != release tag $TAG"; exit 1; }

      - run: npm pack

      - name: Tarball composition (required files present, sources absent)
        run: |
          TARBALL=$(ls *.tgz | head -1)
          tar -tzf "$TARBALL" > /tmp/tarball-list.txt
          for required in \
            package/dist/index.js \
            package/web/index.html \
            package/web/vendor/d3.min.js \
            package/plugin/megamemory.ts \
            package/commands \
            package/docs \
            package/fixtures/eval.jsonl \
            package/fixtures/demo.db \
            package/README.md \
            package/README.ru.md \
            package/LICENSE; do
            grep -q "^${required}" /tmp/tarball-list.txt \
              || { echo "tarball is missing ${required}"; exit 1; }
          done
          for forbidden in package/src/ package/tests/ package/plans/; do
            if grep -q "^${forbidden}" /tmp/tarball-list.txt; then
              echo "tarball must not contain ${forbidden}"; exit 1
            fi
          done

      - name: Tarball smoke (installs and starts)
        run: |
          TARBALL=$(ls *.tgz | head -1)
          mkdir -p /tmp/mm-smoke
          cd /tmp/mm-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" >/dev/null
          ./node_modules/.bin/megamemory --version
          ./node_modules/.bin/megamemory --help >/dev/null
          # План 11 (2.2.1): фикстуры только для чтения — stats работает на
          # копии; прямое --db в fixtures/ установленный пакет мутировал бы
          # (авто-миграция + отложенный чекпоинт на выходе процесса).
          cp ./node_modules/@bloodyeagle/megamemory/fixtures/demo.db /tmp/mm-smoke/demo-copy.db
          ./node_modules/.bin/megamemory stats --db /tmp/mm-smoke/demo-copy.db >/dev/null

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach tarball to the release
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
