name: nightly
on:
  schedule: [{ cron: "0 3 * * *" }]
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      # C-08: a clean checkout has no dist. The integration project in
      # vitest.config.ts spawns the compiled CLI, so build must precede the
      # suite — otherwise the nightly only passes on machines with a stale
      # local dist. Smoke proves the freshly built artifact starts.
      - run: npm run build
      - name: Smoke (compiled CLI starts)
        run: node dist/index.js --help
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small
      # Full suite (includes model-backed tests); non-blocking for PRs by design
      - run: npm test
